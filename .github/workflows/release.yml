name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Build Release
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package .app
        run: |
          APP_PATH=$(find build -name "Coucou.app" -o -name "NotchBuddy.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, searching..."
            find build -name "*.app" -maxdepth 5
            APP_PATH=$(find build -name "*.app" | head -1)
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Coucou.app
          ditto -c -k --sequesterRsrc --keepParent Coucou.app Coucou-macOS.zip
          ls -lh Coucou-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-macOS
          path: Coucou-macOS.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Coucou $TAG" \
            --generate-notes \
            Coucou-macOS.zip

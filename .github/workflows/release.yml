name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache TDLib
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: tdlib-install
          key: tdlib-macos-arm64-v1

      - name: Build TDLib
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          brew install gperf cmake openssl
          git clone --depth 1 https://github.com/tdlib/td.git
          cd td
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DOPENSSL_ROOT_DIR=$(brew --prefix openssl) \
                ..
          cmake --build . --target tdjson -j$(sysctl -n hw.ncpu)
          echo "=== Looking for libtdjson ==="
          find . -name "libtdjson*" -type f
          cd ../..
          mkdir -p tdlib-install/lib
          DYLIB=$(find td -name "libtdjson*.dylib" | head -1)
          echo "Found: $DYLIB"
          cp "$DYLIB" tdlib-install/lib/libtdjson.dylib
          ls -lh tdlib-install/lib/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Build Release
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            ONLY_ACTIVE_ARCH=NO \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS= ' \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package .app
        run: |
          APP_PATH=$(find build -name "Coucou.app" -o -name "NotchBuddy.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, searching..."
            find build -name "*.app" -maxdepth 5
            APP_PATH=$(find build -name "*.app" | head -1)
          fi
          echo "Found app at: $APP_PATH"
          # Embed TDLib
          mkdir -p "$APP_PATH/Contents/Frameworks"
          TDLIB=$(find tdlib-install -name "libtdjson.dylib" | head -1)
          if [ -n "$TDLIB" ]; then
            cp "$TDLIB" "$APP_PATH/Contents/Frameworks/"
            install_name_tool -id @rpath/libtdjson.dylib "$APP_PATH/Contents/Frameworks/libtdjson.dylib"
          fi
          cp -R "$APP_PATH" Coucou.app
          ditto -c -k --sequesterRsrc --keepParent Coucou.app Coucou-macOS.zip
          ls -lh Coucou-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-macOS
          path: Coucou-macOS.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Coucou $TAG" \
            --generate-notes \
            Coucou-macOS.zip
